<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Music adb</title>
  <desc id="banner-desc">用鼠标和键盘控制手机音乐播放</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111c2e"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>

  <g fill="none" stroke="#38bdf8" stroke-width="2">
    <circle cx="1124" cy="52" r="128" stroke-opacity="0.30"/>
    <circle cx="1124" cy="52" r="196" stroke-opacity="0.16"/>
    <circle cx="1124" cy="52" r="264" stroke-opacity="0.08"/>
  </g>

  <!-- 左侧文字区 -->
  <rect x="80" y="88" width="56" height="6" rx="3" fill="url(#bar)"/>
  <text x="80" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="#f8fafc" letter-spacing="-1">Music adb</text>
  <text x="82" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', Helvetica, Arial, sans-serif" font-size="30" fill="#cbd5e1">用鼠标和键盘控制手机音乐播放</text>

  <!-- 右侧：手机 + 声波 -->
  <g transform="translate(1006,58)">
    <rect x="0" y="0" width="176" height="204" rx="28" fill="#0f1b2e" stroke="url(#phone)" stroke-width="2.5"/>
    <rect x="66" y="14" width="44" height="6" rx="3" fill="#334155"/>
    <g fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round">
      <line x1="56" y1="104" x2="56" y2="128"/>
      <line x1="72" y1="92" x2="72" y2="140"/>
      <line x1="88" y1="72" x2="88" y2="160"/>
      <line x1="104" y1="86" x2="104" y2="146"/>
      <line x1="120" y1="100" x2="120" y2="132"/>
    </g>
    <rect x="60" y="176" width="56" height="5" rx="2.5" fill="#1e2a3e"/>
  </g>

  <!-- 左下：连接指示 -->
  <g transform="translate(80,282)">
    <circle cx="6" cy="-5" r="5" fill="#34d399"/>
    <text x="20" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">adb · Windows · PyQt5</text>
  </g>
</svg>
